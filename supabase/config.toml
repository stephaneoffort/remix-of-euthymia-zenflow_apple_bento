[auth]
  additional_redirect_urls = ["https://id-preview--0bc87be4-346b-443f-9d4d-a55071eb85f4.lovable.app", "https://id-preview--0bc87be4-346b-443f-9d4d-a55071eb85f4.lovable.app/**", "https://euthymia-zenflow-bento.lovable.app", "https://euthymia-zenflow-bento.lovable.app/**", "http://localhost:8080", "http://localhost:8080/**"]
  site_url = "https://euthymia-zenflow-bento.lovable.app"
  [auth.email]
    double_confirm_changes = true
    enable_confirmations = true
    enable_signup = true
    [auth.email.template]
      [auth.email.template.confirmation]
        content_path = "./supabase/templates/confirmation.html"
        subject = "Confirmez votre email — ZenFlow"
      [auth.email.template.invite]
        content_path = "./supabase/templates/invite.html"
        subject = "Vous avez été invité sur ZenFlow"
      [auth.email.template.magic_link]
        content_path = "./supabase/templates/magic_link.html"
        subject = "Votre lien de connexion — ZenFlow"
      [auth.email.template.recovery]
        content_path = "./supabase/templates/recovery.html"
        subject = "Réinitialisation de mot de passe — ZenFlow"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.gmail-oauth-diagnostic]
    verify_jwt = false
  [functions.integration-oauth]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.support-chat]
    verify_jwt = true
